<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Check ticket fields</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&amp;family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;font-family:'IBM Plex Sans',system-ui,sans-serif;background:#F2F3F5;color:#161C2A}
a{color:#0D085C}a:hover{color:#C44104}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #F2F3F5; font-family: 'IBM Plex Sans', system-ui, sans-serif; color: #161C2A">
<div style="display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 10px 16px 10px 4px; background: #FFFFFF; border-bottom: 4px solid #0D085C">
<a href="Main.dc.html" style="min-height: 44px; display: flex; align-items: center; gap: 6px; padding: 0 12px; text-decoration: none; font-size: 15px; font-weight: 600">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg>
Retake
</a>
<img src="/_blob/e20dd83250042f8ee0943ff703171cf2" alt="Indeca Crude Xpress" style="width: 110px; height: 32px; display: block">
</div>
<div style="flex-grow: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; padding: 16px">
<div style="display: flex; gap: 12px; align-items: center">
<div style="width: 76px; height: 104px; flex-shrink: 0; border-radius: 0; background: #E3E6EB; border: 1px solid #C9CDD5; display: flex; align-items: center; justify-content: center; font-size: 11px; color: #565B66; text-align: center">Ticket photo</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<div style="font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; font-weight: 700; font-size: 24px; text-transform: uppercase; letter-spacing: 0.02em; color: #0D085C">Check ticket</div>
<div style="font-size: 16px; font-weight: 600">{{readCount}} of {{totalCount}} fields read</div>
<div style="display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 600; color: #8A3303">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true"><path d="M12 9v4"></path><path d="M12 17h.01"></path><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"></path></svg>
1 field needs you before logging
</div>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 10px; padding: 16px; background: #FDE6D6; border: 2px solid #C44104; border-radius: 0">
<label for="b-gauge" style="font-size: 15px; font-weight: 600">B Gauge — couldn't read clearly</label>
<div style="font-size: 14px; color: #6B2800">Check the printed ticket and correct this if it's wrong.</div>
<input id="b-gauge" type="text" value="4' 1.25&quot;" style="height: 48px; box-sizing: border-box; padding: 0 14px; font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 18px; border: 1px solid #C44104; border-radius: 0; background: #FFFFFF; color: #161C2A">
<label style="display: flex; align-items: center; gap: 10px; min-height: 44px; font-size: 15px; font-weight: 500">
<input type="checkbox" checked style="width: 22px; height: 22px; accent-color: #C44104">
Matches the ticket
</label>
</div>
<div style="display: flex; flex-direction: column; background: #FFFFFF; border: 1px solid #D5D8DE; border-radius: 0">
<div style="padding: 12px 16px 4px 16px; font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; font-weight: 600; font-size: 15px; letter-spacing: 0.06em; text-transform: uppercase; color: #0D085C">Read from ticket</div>
<sc-for list="{{fields}}" as="f" hint-placeholder-count="13">
<div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 44px; padding: 0 16px; border-top: 1px solid #E8EAEE">
<div style="font-size: 15px; color: #3A404C">{{f.label}}</div>
<div style="display: flex; align-items: center; gap: 8px">
<div style="font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 15px; font-weight: 500">{{f.value}}</div>
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#2F6B3A" stroke-width="2.5" stroke-linecap="square" stroke-linejoin="miter" aria-label="Read"><path d="M20 6 9 17l-5-5"></path></svg>
</div>
</div>
</sc-for>
</div>
<div style="display: flex; flex-direction: column; gap: 14px; padding: 12px 16px 16px 16px; background: #FFFFFF; border: 1px solid #D5D8DE; border-radius: 0">
<div style="font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; font-weight: 600; font-size: 15px; letter-spacing: 0.06em; text-transform: uppercase; color: #0D085C">You add</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<div style="font-size: 14px; font-weight: 600; color: #3A404C">Reject</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0; border: 1px solid #0D085C">
<button type="button" style="height: 44px; border: 0; border-radius: 0; background: #0D085C; color: #FFFFFF; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer">No</button>
<button type="button" style="height: 44px; border: 0; border-radius: 0; background: #FFFFFF; color: #0D085C; font-family: inherit; font-size: 15px; font-weight: 500; cursor: pointer">Yes</button>
</div>
</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="station" style="font-size: 14px; font-weight: 600; color: #3A404C">Station #</label>
<input id="station" type="text" value="12" style="height: 44px; box-sizing: border-box; padding: 0 12px; font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 16px; border: 1px solid #9AA0AC; border-radius: 0; background: #FFFFFF; color: #161C2A">
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="wait" style="font-size: 14px; font-weight: 600; color: #3A404C">Wait time (hrs)</label>
<input id="wait" type="text" value="0" style="height: 44px; box-sizing: border-box; padding: 0 12px; font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 16px; border: 1px solid #9AA0AC; border-radius: 0; background: #FFFFFF; color: #161C2A">
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="comments" style="font-size: 14px; font-weight: 600; color: #3A404C">Comments</label>
<textarea id="comments" rows="2" placeholder="Optional" style="box-sizing: border-box; padding: 10px 12px; font-family: inherit; font-size: 15px; border: 1px solid #9AA0AC; border-radius: 0; background: #FFFFFF; color: #161C2A; resize: none"></textarea>
</div>
</div>
</div>
<div style="padding: 12px 16px 24px 16px; border-top: 1px solid #D5D8DE; background: #F2F3F5">
<a href="MyLoads.dc.html" style="height: 56px; display: flex; align-items: center; justify-content: center; gap: 10px; background: #C44104; color: #FFFFFF; border-radius: 0; text-decoration: none; font-size: 17px; font-weight: 600">
Log this load
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true"><path d="M5 12h14"></path><path d="m12 5 7 7-7 7"></path></svg>
</a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const fields = [
{ label: 'Date', value: '09/24' },
{ label: 'Lease #', value: '40844' },
{ label: 'Ticket #', value: '1180562' },
{ label: 'Tank #', value: '3' },
{ label: 'G/M', value: 'G' },
{ label: 'T.Temp', value: '76' },
{ label: 'Top gauge', value: "14' 3.5\"" },
{ label: 'B.Temp', value: '75' },
{ label: 'Ob.Grav', value: '41.8' },
{ label: 'Ob.Temp', value: '76' },
{ label: 'S&W', value: '0.2' },
{ label: 'Seal On', value: '0048813' },
{ label: 'Seal Off', value: '0048812' }
];
return { fields, readCount: fields.length, totalCount: fields.length + 1 };
}
}
</script>
</body>
</html>
